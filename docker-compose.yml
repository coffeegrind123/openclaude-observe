# Docker Compose config for OpenClaude Observe
# Start with `docker compose up openclaude-observe` (or `just start`).
# For local dev with hot reload, use `just dev` instead.
#
services:
  openclaude-observe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaude-observe
    environment:
      OPENCLAUDE_OBSERVE_SERVER_PORT: "${OPENCLAUDE_OBSERVE_SERVER_PORT:-4981}"
      OPENCLAUDE_OBSERVE_DB_PATH: /data/observe.db
      OPENCLAUDE_OBSERVE_CLIENT_DIST_PATH: /app/client/dist
      OPENCLAUDE_OBSERVE_LOG_LEVEL: "${OPENCLAUDE_OBSERVE_LOG_LEVEL:-debug}"
      OPENCLAUDE_OBSERVE_RUNTIME: docker
      # Bind to all interfaces inside the container so Docker's published
      # port can reach the server. The container network namespace is the
      # boundary here; the default 'localhost' bind is only listenable from
      # inside the container and yields ERR_EMPTY_RESPONSE on the host.
      OPENCLAUDE_OBSERVE_SERVER_HOST: "${OPENCLAUDE_OBSERVE_SERVER_HOST:-0.0.0.0}"
      # Transcript token stats. On-demand parse of ~/.claude/projects JSONL
      # transcripts for per-prompt / per-model token + cost breakdowns.
      # Set OPENCLAUDE_OBSERVE_TRANSCRIPT_STATS=0 to disable. The host base is
      # translated to the in-container mount path below; transcript_path
      # values stored in the DB are always host paths.
      OPENCLAUDE_OBSERVE_TRANSCRIPT_STATS: "${OPENCLAUDE_OBSERVE_TRANSCRIPT_STATS:-1}"
      OPENCLAUDE_OBSERVE_TRANSCRIPT_CLAUDE_HOST_BASE: "${OPENCLAUDE_OBSERVE_TRANSCRIPT_CLAUDE_HOST_BASE:-${HOME}/.claude/projects}"
      OPENCLAUDE_OBSERVE_TRANSCRIPT_CLAUDE_CONTAINER_BASE: /host/.claude/projects
      # Interactive memory browser/editor. Reads AND WRITES OpenClaude's
      # file-based memory under ~/.claude. The host config dir is bind-mounted
      # read-write below; the container base mirrors that mount point.
      # Set OPENCLAUDE_OBSERVE_MEMORY=0 to disable the feature + drop the mount.
      OPENCLAUDE_OBSERVE_MEMORY: "${OPENCLAUDE_OBSERVE_MEMORY:-1}"
      OPENCLAUDE_OBSERVE_MEMORY_CLAUDE_HOST_BASE: "${OPENCLAUDE_OBSERVE_MEMORY_CLAUDE_HOST_BASE:-${HOME}/.claude}"
      OPENCLAUDE_OBSERVE_MEMORY_CLAUDE_CONTAINER_BASE: /host-rw/.claude
    ports:
      - "${OPENCLAUDE_OBSERVE_SERVER_PORT:-4981}:${OPENCLAUDE_OBSERVE_SERVER_PORT:-4981}"
    volumes:
      - ${OPENCLAUDE_OBSERVE_DATA_DIR:-./data}:/data
      # Read-only mount of the host's Claude transcripts so the server can
      # parse them for the Token Usage stats panel.
      - ${OPENCLAUDE_OBSERVE_TRANSCRIPT_CLAUDE_HOST_BASE:-${HOME}/.claude/projects}:/host/.claude/projects:ro
      # Read-WRITE mount of the host's Claude config dir so the Memory browser
      # can view and EDIT OpenClaude's memory files. Distinct from the
      # read-only transcript mount above — same host tree, separate mount with
      # write access scoped to the memory feature's path guards.
      - ${OPENCLAUDE_OBSERVE_MEMORY_CLAUDE_HOST_BASE:-${HOME}/.claude}:/host-rw/.claude
